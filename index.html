<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LiveLog</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- ヘッダー -->
        <header class="header">
            <h1>🎫 LiveLog</h1>
            <p class="subtitle">わたしのライブ記録</p>
        </header>


        <!-- ホーム画面 -->
        <div id="home">

            <!-- 次のライブ -->
            <section class="home-section">

                <p class="section-label">NEXT LIVE</p>

                <div class="next-live-card">

                    <p class="days">あと <span>--</span> 日</p>

                    <h2>💛 センラ</h2>

                    <p class="tour-name">○○ TOUR 2026</p>

                    <p class="live-info">
                        📅 2026/09/15<br>
                        🕕 18:00<br>
                        📍 日本武道館
                    </p>

                    <button>ライブ詳細を見る</button>

                </div>

            </section>


            <!-- 前のライブ -->
            <section class="home-section">

                <p class="section-label">LAST LIVE</p>

                <div class="simple-card">

                    <p class="days">前のライブから <strong>--</strong> 日</p>

                    <p>まだライブの記録がありません</p>

                </div>

            </section>


            <!-- 1年前の今日 -->
            <section class="home-section">

                <p class="section-label">ON THIS DAY</p>

                <div class="simple-card">

                    <h2>🥹 1年前の今日は…</h2>

                    <p>まだこの日のライブ記録がありません</p>

                </div>

            </section>


            <!-- 総参戦数 -->
            <section class="total-section">

                <p class="section-label">TOTAL LIVE</p>

                <p class="count" id="count">0</p>

                <p>公演</p>

            </section>


            <!-- ライブ登録 -->
            <button class="add-button" onclick="showForm()">
                ＋ ライブを記録
            </button>

            <div id="liveList"></div>

        </div>


        <!-- ライブ登録画面 -->
        <div id="form" style="display: none;">

            <h2 class="section-title">＋ ライブを記録</h2>

            <label>アーティスト</label>
            <input type="text" id="artist" placeholder="例：浦島坂田船">

            <label>ツアー名</label>
            <input type="text" id="tour" placeholder="例：○○TOUR 2026">

            <label>公演日</label>
            <input type="date" id="date">

            <label>会場</label>
            <input type="text" id="venue" placeholder="例：日本武道館">

            <label>チケット代</label>
            <input type="number" id="ticketPrice" placeholder="例：8800">

            <label>感想</label>
            <textarea id="memo" placeholder="ライブの感想を書こう！"></textarea>

            <br><br>

            <button onclick="saveLive()">保存する</button>

            <button onclick="showHome()">戻る</button>

        </div>

    </div>

    <script src="script.js?v=3"></script>

</body>

</html>
